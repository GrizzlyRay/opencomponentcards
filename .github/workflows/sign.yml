name: Sign cards

on:
  push:
    branches: [main]
    paths:
      - "cards/**/*.yaml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: sigstore/cosign-installer@v3

      - name: Pick cards to sign
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            find cards -name '*.yaml' | sort > /tmp/cards.txt
          else
            git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'cards/**/*.yaml' > /tmp/cards.txt
          fi
          cat /tmp/cards.txt

      - name: Sign with Sigstore (keyless)
        run: |
          while read -r card; do
            [ -n "$card" ] || continue
            # Write only this workflow's own bundle. Other signers' files in the
            # folder are never touched, so a stale one shows up in the verifier.
            mkdir -p "${card}.sigs"
            cosign sign-blob --yes --bundle "${card}.sigs/grizzlyray-sign-workflow.sigstore.json" "$card"
          done < /tmp/cards.txt

      - name: Commit bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Sign cards with Sigstore [skip ci]"
            git push
          fi

      # Check the re-signed state that's now on main. This is the strict
      # signature check for card changes.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify signatures after re-signing
        run: |
          shopt -s globstar nullglob
          python3 tools/verify_signer.py --check-policy
          tools/verify.sh --strict cards/**/*.yaml
          python3 tests/test_verify_signer.py
