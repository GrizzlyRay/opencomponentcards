name: Validate cards

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate schema and cards
        run: |
          shopt -s globstar nullglob
          python3 tools/validate.py --schema schema/card.schema.json cards/**/*.yaml
      - name: Validate signer policy
        run: python3 tools/verify_signer.py --check-policy
      - uses: sigstore/cosign-installer@v3
      # If cards changed, their signatures are stale until sign.yml re-signs them
      # after merge (and contributors' PRs never carry fresh registry signatures),
      # so the check only reports. sign.yml runs the strict check on the
      # re-signed state. If no cards changed, stale signatures are a real failure.
      - name: Did any cards change?
        id: cards
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed=$(git ls-files 'cards/**/*.yaml' | head -1)
          else
            changed=$(git diff --name-only "$base" HEAD -- 'cards/**/*.yaml')
          fi
          if [ -n "$changed" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          echo "Changed cards:"; echo "$changed"
      - name: Verify card signatures (strict, no cards changed)
        if: steps.cards.outputs.changed == 'false'
        run: |
          shopt -s globstar nullglob
          tools/verify.sh --strict cards/**/*.yaml
          python3 tests/test_verify_signer.py
      - name: Report card signatures (cards changed, re-signed after merge)
        if: steps.cards.outputs.changed == 'true'
        run: |
          shopt -s globstar nullglob
          if tools/verify.sh cards/**/*.yaml && python3 tests/test_verify_signer.py; then
            echo "All signatures already valid."
          else
            echo "::notice::Cards changed, so some signatures are stale. That's expected; the sign workflow re-signs on main and runs the strict check there."
          fi
